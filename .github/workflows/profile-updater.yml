name: Update Profile Assets

on:
  schedule:
    # Runs every 12 hours
    - cron: '0 */12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: git-profile-koi
        uses: yalongwastaken/git-koi@v1.0.1
        with:
          login: ${{ github.repository_owner }}
          body: black
          output-dir: koi
          token: ${{ github.token }}

      - name: Commit and push koi assets
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          TARGET_BRANCH="${GITHUB_REF_NAME:-main}"
          
          # 1. Back up generated koi files to temp directory outside git
          mkdir -p /tmp/koi_assets
          cp -r koi/* /tmp/koi_assets/
          
          # 2. Sync local branch exactly with latest remote state
          git fetch origin "${TARGET_BRANCH}"
          git reset --hard "origin/${TARGET_BRANCH}"
          
          # 3. Restore the new assets back into the workspace
          mkdir -p koi
          cp -r /tmp/koi_assets/* koi/
          
          # 4. Check for actual changes
          git add koi/
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          
          # 5. Commit and fast-forward push
          git commit -m "Update profile assets"
          git push origin "HEAD:${TARGET_BRANCH}"
