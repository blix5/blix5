name: Update Profile Assets

on:
  schedule:
    # Runs every 12 hours
    - cron: '0 */12 * * *'
  workflow_dispatch: # Allows manual trigger from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: git-profile-koi
        uses: yalongwastaken/git-koi@v1.0.1
        with:
          login: ${{ github.repository_owner }}
          body: black
          output-dir: koi
          token: ${{ github.token }}

      - name: Rebase on latest branch tip
        run: git pull --rebase --autostash origin "${GITHUB_REF_NAME}"

      - name: Commit and push koi assets
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update profile assets"
          file_pattern: "koi/*"
