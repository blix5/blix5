name: Update Profile Assets

on:
  schedule:
    # Runs every 12 hours
    - cron: '0 */12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: git-profile-koi
        uses: yalongwastaken/git-koi@v1.0.1
        with:
          login: ${{ github.repository_owner }}
          body: black
          output-dir: koi
          token: ${{ github.token }}

      - name: Commit and push koi assets
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # 1. Fetch latest remote commit
          git fetch origin "${GITHUB_REF_NAME}"
          
          # 2. Reset HEAD to remote while preserving newly generated koi/ files
          git reset --mixed "origin/${GITHUB_REF_NAME}"
          
          # 3. Stage changes and exit early if nothing changed
          git add koi/
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          
          # 4. Commit and fast-forward push
          git commit -m "Update profile assets"
          git push origin "HEAD:${GITHUB_REF_NAME}"
